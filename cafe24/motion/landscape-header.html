<!-- 2026-10-16 phone held sideways (id: bth-land-hdr): the header and the bottom menu slide away while scrolling down
     and come back when scrolling up, so the page gets the whole short screen. PC, tablets and upright phones are unchanged.
     Nothing runs on page load. To undo, delete this block. -->
<style id="bth-land-hdr-css">
@media (orientation: landscape) and (max-height: 599px) {
  #header, .bth-tabbar { transition: transform .3s cubic-bezier(.2,.7,.2,1) !important; }
  :is(html,#_#_#_#_#_#_#_#_#_#_#_#_#_#_#_#_#_#_).bthl-up #header { transform: translateY(-100%) !important; }
  :is(html,#_#_#_#_#_#_#_#_#_#_#_#_#_#_#_#_#_#_).bthl-up .bth-tabbar { transform: translateY(110%) !important; }
}
@media (orientation: landscape) and (max-height: 599px) and (prefers-reduced-motion: reduce) {
  #header, .bth-tabbar { transition: none !important; }
}
</style>
<script id="bth-land-hdr">
(function(){
  if (window.__bthLandHdr) return; window.__bthLandHdr = 1;
  var h = document.documentElement, mq = window.matchMedia && matchMedia('(orientation: landscape) and (max-height: 599px)');
  if (!mq) return;
  var lastY = window.pageYOffset || 0, ticking = false;
  function busy(){
    var b = document.body;
    return !b || b.style.overflow === 'hidden' || h.style.overflow === 'hidden' || h.classList.contains('bth-aside-open');
  }
  function run(){
    ticking = false;
    var y = window.pageYOffset || 0;
    if (!mq.matches || y < 80 || busy()) { h.classList.remove('bthl-up'); lastY = y; return; }
    if (y - lastY > 6) h.classList.add('bthl-up');
    else if (lastY - y > 6) h.classList.remove('bthl-up');
    lastY = y;
  }
  window.addEventListener('scroll', function(){ if (!ticking) { ticking = true; requestAnimationFrame(run); } }, { passive: true });
  window.addEventListener('resize', run);
})();
</script>
