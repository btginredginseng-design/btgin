<style id="bth-motion-css">
/* 1. Page-to-page cross-fade (Chrome, Edge, Samsung Internet, Safari 18.2+; other browsers load pages normally) */
@media (prefers-reduced-motion: no-preference) {
  @view-transition { navigation: auto; }
  ::view-transition-old(root) { animation: bthVtOut .18s cubic-bezier(.4,0,1,1) both; }
  ::view-transition-new(root) { animation: bthVtIn .32s cubic-bezier(.2,.7,.2,1) both; }
  #header { view-transition-name: bth-header; }
  .bth-tabbar { view-transition-name: bth-tabbar; }
  ::view-transition-group(bth-header), ::view-transition-group(bth-tabbar) { animation-duration: .25s; }
  /* the transition replaces the 1-second white loading cover */
  html.bthm-vt .loading { display: none !important; }
}
@keyframes bthVtOut { to { opacity: 0; } }
@keyframes bthVtIn { from { opacity: 0; transform: translateY(10px); } }

/* 2. Sections rise into view while scrolling (only set up by the script, so nothing stays hidden if it fails) */
html.bthm-on #contents .bthm-rv { opacity: 0; transform: translateY(16px); }
html.bthm-on #contents .bthm-rv.bthm-in {
  opacity: 1; transform: none;
  transition: opacity .55s cubic-bezier(.2,.7,.2,1) calc(var(--bthm-i, 0) * 70ms),
              transform .55s cubic-bezier(.2,.7,.2,1) calc(var(--bthm-i, 0) * 70ms) !important;
}

/* 3. Header slides away when scrolling down and comes back when scrolling up
      (phones held sideways, tablets and PC; upright phones keep the existing logo-row hide) */
#header { transition: transform .32s cubic-bezier(.2,.7,.2,1); }
:is(html,#_#_#_#_#_#_#_#_#_#_#_#_#_#_#_#_).bthm-hdr-up #header { transform: translateY(-100%) !important; }
.bth-tabbar { transition: translate .32s cubic-bezier(.2,.7,.2,1); }
@media (orientation: landscape) and (max-height: 599px) {
  :is(html,#_#_#_#_#_#_#_#_#_#_#_#_#_#_#_#_).bthm-hdr-up .bth-tabbar { translate: 0 110%; }
}

/* 4. Touch and hover feedback (the store's own hover effects stay as they are) */
@media (prefers-reduced-motion: no-preference) {
  .bth-tabbar a { transition: scale .18s ease; }
  .bth-tabbar a:active, .bth-card:active, .bth-link-card:active, #contents .prd-box:active { scale: .97; }
  /* PC: product tiles and info cards lift, photos zoom slowly */
  @media (hover: hover) and (pointer: fine) {
    html #contents .prd-box, html #contents .bth-link-card, html #contents .bth-card {
      transition: transform .2s ease, box-shadow .3s ease, translate .35s cubic-bezier(.2,.7,.2,1), scale .18s ease !important;
    }
    html #contents .prd-box:hover, html #contents .bth-link-card:hover { translate: 0 -4px; }
    html #contents .bth-link-card:hover { box-shadow: 0 14px 30px rgba(18, 60, 115, .12); }
    #contents .prdImg, .bth-tech-media { overflow: hidden; }
    #contents .prdImg img.thumb, .bth-card-media img, .bth-tech-media img {
      transition: scale .7s cubic-bezier(.2,.7,.2,1), opacity .3s ease;
    }
    #contents .prd-box:hover .prdImg img.thumb, .bth-card:hover .bth-card-media img, .bth-link-card:hover .bth-tech-media img { scale: 1.05; }
  }
  /* cart count pops when it changes */
  .bthm-pop { animation: bthPop .45s cubic-bezier(.3,1.6,.5,1); }
}
@keyframes bthPop { 0% { scale: 1; } 40% { scale: 1.45; } 100% { scale: 1; } }

/* 5. Main banner: slow zoom on the photo, headline lines rise in one after another */
@media (prefers-reduced-motion: no-preference) {
  .bth-hero-media { overflow: hidden; }
  .bth-hero-slide.swiper-slide-active .bth-hero-media picture { animation: bthKen 9s cubic-bezier(.25,.6,.3,1) both; }
  .bth-hero-slide.swiper-slide-active .bth-hero-copy .bth-txt > * { animation: bthLine .7s cubic-bezier(.2,.7,.2,1) both; }
  .bth-hero-slide.swiper-slide-active .bth-hero-copy .bth-txt > *:nth-child(2) { animation-delay: .12s; }
  .bth-hero-slide.swiper-slide-active .bth-hero-copy .bth-txt > *:nth-child(3) { animation-delay: .24s; }
}
@keyframes bthKen { from { transform: scale(1); } to { transform: scale(1.06); } }
@keyframes bthLine { from { opacity: 0; transform: translateY(18px); } }

@media (prefers-reduced-motion: reduce) {
  html.bthm-on #contents .bthm-rv { opacity: 1 !important; transform: none !important; }
  #header, .bth-tabbar { transition: none; }
}

<script id="bth-motion">
(function(){
  if (window.__bthMotion) return; window.__bthMotion = 1;
  var h = document.documentElement;
  var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!still && 'onpagereveal' in window) h.classList.add('bthm-vt');
  function ready(fn){ if (document.readyState !== 'loading') fn(); else document.addEventListener('DOMContentLoaded', fn); }

  /* 3. Header hides on scroll down, shows on scroll up (not on upright phones, which already have their own) */
  (function(){
    var lastY = window.pageYOffset || 0, ticking = false;
    function busy(){
      var b = document.body;
      if (!b) return true;
      if (b.style.overflow === 'hidden' || h.style.overflow === 'hidden') return true;
      if (h.classList.contains('bth-aside-open') || /menu-?open|nav-?open|is-open|aside-open/.test(b.className)) return true;
      var hd = document.getElementById('header');
      return !!(hd && hd.matches && hd.matches(':hover, :focus-within'));
    }
    function run(){
      ticking = false;
      var y = window.pageYOffset || 0;
      var upright = window.innerWidth <= 767 && window.innerHeight > window.innerWidth;
      if (upright || y < 160 || busy()) { h.classList.remove('bthm-hdr-up'); lastY = y; return; }
      if (y - lastY > 6) h.classList.add('bthm-hdr-up');
      else if (lastY - y > 6) h.classList.remove('bthm-hdr-up');
      lastY = y;
    }
    window.addEventListener('scroll', function(){ if (!ticking) { ticking = true; requestAnimationFrame(run); } }, { passive: true });
    window.addEventListener('resize', run);
  })();

  if (still) return;

  ready(function(){
    /* 2. Scroll reveals: section titles, cards and product tiles */
    if ('IntersectionObserver' in window) {
      var groups = [
        ['#contents .bth-sec .bth-head', false],
        ['#contents .bth-cat-grid > *', true],
        ['#contents .bth-people > *', true],
        ['#contents .bth-tech-grid > *', true],
        ['#contents .bth-event .bth-wrap > *', true],
        ['#contents .bth-globalstrip .bth-wrap', false],
        ['#contents .xans-product-listmain li[id^="anchorBoxId"] > .prd-box', true],
        ['#contents .xans-product-listnormal li[id^="anchorBoxId"] > .prd-box', true],
        ['#contents .cpb-board .custom-title', false]
      ];
      var vh = window.innerHeight;
      var io = new IntersectionObserver(function(es){
        es.forEach(function(e){
          if (!e.isIntersecting) return;
          var t = e.target; io.unobserve(t); t.classList.add('bthm-in');
          setTimeout(function(){ t.classList.remove('bthm-rv', 'bthm-in'); t.style.removeProperty('--bthm-i'); }, 900);
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
      groups.forEach(function(g){
        var els = document.querySelectorAll(g[0]);
        for (var i = 0; i < els.length; i++) {
          var el = els[i];
          if (el.closest('.mov, .btg-thanks, .swiper-slide-duplicate') || el.classList.contains('bthm-rv')) continue;
          var r = el.getBoundingClientRect();
          if (r.top < vh * 0.92 || r.height === 0) continue;   /* already on screen: leave it alone */
          if (g[1]) {
            var item = el.matches('.prd-box') ? el.parentNode : el;
            var idx = item.parentNode ? Array.prototype.indexOf.call(item.parentNode.children, item) : 0;
            el.style.setProperty('--bthm-i', Math.max(0, idx) % 4);
          }
          el.classList.add('bthm-rv');
          io.observe(el);
        }
      });
      h.classList.add('bthm-on');
      /* safety: anything on screen but still hidden after 6s is shown */
      setTimeout(function(){ var l = document.querySelectorAll('.bthm-rv:not(.bthm-in)'); for (var i = 0; i < l.length; i++) { var r = l[i].getBoundingClientRect(); if (r.top < window.innerHeight) l[i].classList.remove('bthm-rv'); } }, 6000);
    }

    /* 4. Cart count pops when it changes */
    var counts = document.querySelectorAll('.EC-Layout-Basket-count, .bth-tabbar .ad-badge');
    if (window.MutationObserver) for (var c = 0; c < counts.length; c++) (function(el){
      var last = el.textContent.trim();
      new MutationObserver(function(){
        var now = el.textContent.trim(); if (now === last) return; last = now;
        el.classList.remove('bthm-pop'); void el.offsetWidth; el.classList.add('bthm-pop');
      }).observe(el, { childList: true, characterData: true, subtree: true });
    })(counts[c]);

    /* 6. Numbers count up when they come into view (coupon amounts, 4개국 …) */
    if ('IntersectionObserver' in window) {
      var NUM = /(\d{1,3}(?:,\d{3})+|\d+)/;
      var boxes = document.querySelectorAll('#contents .bth-event, #contents .bth-globalstrip, [data-bth-count]');
      var nodes = [];
      for (var b = 0; b < boxes.length; b++) {
        var w = document.createTreeWalker(boxes[b], NodeFilter.SHOW_TEXT, null, false), n;
        while ((n = w.nextNode())) {
          var p = n.parentNode;
          if (!p || /^(SCRIPT|STYLE)$/.test(p.nodeName)) continue;
          if (p.closest('.swiper-slide-duplicate, .bth-hero')) continue;
          var m = n.nodeValue.match(NUM); if (!m) continue;
          var val = parseInt(m[1].replace(/,/g, ''), 10); if (!(val >= 2)) continue;
          nodes.push(n);
        }
      }
      var cio = new IntersectionObserver(function(es){
        es.forEach(function(e){
          if (!e.isIntersecting) return; cio.unobserve(e.target);
          (e.target.__bthNums || []).forEach(function(t){
            var full = t.nodeValue, m = full.match(NUM); if (!m) return;
            var end = parseInt(m[1].replace(/,/g, ''), 10), comma = m[1].indexOf(',') > -1;
            var pre = full.slice(0, m.index), post = full.slice(m.index + m[1].length);
            var t0 = null, dur = end > 999 ? 1100 : 800;
            function fmt(v){ return comma ? v.toLocaleString('en-US') : String(v); }
            function step(ts){
              if (t0 === null) t0 = ts;
              var k = Math.min(1, (ts - t0) / dur), ease = 1 - Math.pow(1 - k, 3);
              t.nodeValue = pre + fmt(Math.round(end * ease)) + post;
              if (k < 1) requestAnimationFrame(step); else t.nodeValue = full;
            }
            requestAnimationFrame(step);
          });
        });
      }, { threshold: 0.6 });
      nodes.forEach(function(t){
        var el = t.parentNode;
        if (el.getBoundingClientRect().top < window.innerHeight * 0.9) return;   /* already visible: don't flicker */
        (el.__bthNums = el.__bthNums || []).push(t);
        cio.observe(el);
      });
    }
  });
})();
</script>
