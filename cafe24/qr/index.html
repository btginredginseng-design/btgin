  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>비티진 공식몰 | 언어 선택 · Select Language</title>
  <meta name="description" content="비티진 홍삼을 구매해 주셔서 감사합니다. 언어를 선택해 주세요. — Thank you for choosing BTGin red ginseng. Please select your language.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    /* ===== Brand tokens (taken from btginmall.com) ===== */
    :root {
      --brand: #03419c;      /* BTGin logo blue */
      --ink: #181818;        /* headings */
      --sub: #6b6b70;        /* secondary text */
      --card: #f3f2f0;       /* warm grey cards */
      --line: #e3e0dd;
      --font: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: var(--font);
      color: var(--ink);
      background: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* Everything centred on the phone screen */
    .screen {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
    }

    .logo {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: .02em;
      color: var(--brand);
      line-height: 1;
    }
    .logo img { width: 240px; max-width: 70vw; height: auto; display: block; margin: 0 auto; }
    .store { margin-top: 10px; font-size: 13px; color: var(--sub); }

    .message {
      width: 100%;
      max-width: 340px;
      margin-top: 32px;
      padding: 22px 18px;
      border-radius: 20px;
      background: var(--card);
    }
    .message p + p { margin-top: 14px; }

    .ko { display: block; font-size: 18px; font-weight: 700; word-break: keep-all; }
    .en { display: block; font-size: 14px; color: var(--sub); margin-top: 2px; }

    .langs {
      width: 100%;
      max-width: 340px;
      margin-top: 22px;
      display: grid;
      gap: 12px;
    }
    .lang {
      display: block;
      padding: 16px 20px;
      border-radius: 999px;
      text-decoration: none;
      transition: transform .15s ease, background-color .15s ease;
    }
    .lang:active { transform: scale(.98); }
    .lang:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
    .lang strong { display: block; font-size: 19px; font-weight: 700; }
    .lang span { display: block; font-size: 13px; margin-top: 1px; }

    .lang-ko { background: var(--brand); color: #fff; }
    .lang-ko span { color: rgba(255,255,255,.75); }
    .lang-en { background: #fff; color: var(--brand); border: 1.5px solid var(--brand); }
    .lang-en span { color: var(--sub); }

    @media (hover: hover) {
      .lang:hover { transform: translateY(-2px); }
    }
  </style>
</head>
