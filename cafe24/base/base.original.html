<!-- 2026-10-08 no-jump gate (product page buy box + cart): the block stays invisible while the page scripts finish their first pass, then fades in once in its final form. A CSS timer shows it after 3s even if a script fails. -->
<script>
(function(){
  var p = location.pathname;
  var g = /\/order\/basket\.html/.test(p) ? 'bth-gate-cart' : (/\/product\/(detail\.html|[^\/]+\/\d+(\/|$))/.test(p) ? 'bth-gate-prd' : '');
  if (!g) return;
  var h = document.documentElement, done = false;
  h.classList.add(g);
  function open(){ if (done) return; done = true; h.classList.add('bth-gate-open'); }
  window.bthGateOpen = open;
  setTimeout(open, 2500);
  document.addEventListener('DOMContentLoaded', function(){
    var el = document.querySelector(g === 'bth-gate-cart' ? '#contents #cpb-cart' : '#contents .detailArea .infoArea');
    if (!el) { setTimeout(open, 60); return; }
    // show the block once its height has stopped changing for 0.22s, and no later than 0.9s after the page is ready
    var last = -1, still = 0, start = Date.now();
    var iv = setInterval(function(){
      var hgt = el.offsetHeight;
      if (hgt === last) still += 55; else { still = 0; last = hgt; }
      if (still >= 220 || Date.now() - start > 900) { clearInterval(iv); open(); }
    }, 55);
  });
})();
</script>
<style id="bth-gate-css">
@keyframes bthGateShow{to{opacity:1}}
html.bth-gate-prd:not(.bth-gate-open) #contents .detailArea .infoArea,
html.bth-gate-cart:not(.bth-gate-open) #contents #cpb-cart{opacity:0;animation:bthGateShow .01s linear 3s forwards}
html.bth-gate-prd #contents .detailArea .infoArea,
html.bth-gate-cart #contents #cpb-cart{transition:opacity .16s ease}
</style>

<!-- 2026-10-08: Kakao + BTGin chat buttons appear together (Kakao waits for Channel Talk, max 4s), and both hide while the side menu is open -->
<script>
(function(){
  var h = document.documentElement, done = false;
  h.classList.add('bth-fab-wait');
  function show(){ if (done) return; done = true; h.classList.remove('bth-fab-wait'); }
  function launcherShown(){
    var e = document.getElementById('ch-plugin-entry'), k = e && e.firstElementChild, r = k && k.shadowRoot;
    if (!r) return false;
    var els = r.querySelectorAll('*');
    for (var i = 0; i < els.length; i++) { var b = els[i].getBoundingClientRect(); if (b.width > 20 && b.height > 20) return true; }
    return false;
  }
  function check(){ if (done) return; if (launcherShown() || (window.performance && performance.now() > 4000)) { show(); return; } setTimeout(check, 150); }
  setTimeout(check, 150);
  document.addEventListener('DOMContentLoaded', function(){
    var a = document.getElementById('aside'); if (!a) return;
    var upd = function(){ h.classList.toggle('bth-aside-open', a.classList.contains('act')); };
    if (window.MutationObserver) new MutationObserver(upd).observe(a, {attributes:true, attributeFilter:['class']});
    upd();
  });
})();
</script>
