<!doctype html>
<!-- Treatment: keyword-pop (emphasis beat). One word, accent plate, lower third. Never more than 3 words. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { margin: 0; background: transparent; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--font-display); }
  .pop { position: absolute; left: 50%; bottom: calc(var(--safe-y) + 120px); transform: translateX(-50%);
         padding: 14px 36px; background: var(--accent); color: var(--ink-dark); border-radius: var(--radius);
         font-size: var(--size-title); font-weight: var(--weight-display); white-space: nowrap; opacity: 0; }
</style></head>
<body>
<div id="root" data-composition-id="{{ID}}" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
  <div class="pop" data-qc-align="center" data-qc-safe="title">{{KEYWORD}}</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="../hf-timeline.js"></script>
<script>
  const D = parseFloat(document.getElementById("root").dataset.duration);
  const tl = gsap.timeline({ paused: true });
  // xPercent keeps the -50% centering inside the transform the timeline writes.
  tl.fromTo(".pop", { xPercent: -50, opacity: 0, scale: 0.6, rotation: -4 }, { xPercent: -50, opacity: 1, scale: 1, rotation: 0, duration: 0.28, ease: "back.out(2.2)" }, 0)
    .to(".pop", { opacity: 0, scale: 0.9, duration: 0.2, ease: "power2.in" }, D - 0.2);
  window.__timelines = window.__timelines || {};
  window.__timelines["{{ID}}"] = tl;
</script>
</body></html>
