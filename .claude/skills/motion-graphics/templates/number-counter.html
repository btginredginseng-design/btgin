<!doctype html>
<!-- Treatment: number-counter (stat beat). The number counts up and lands exactly when it is spoken. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { margin: 0; background: transparent; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--font-display); }
  .card { position: absolute; right: var(--safe-x); top: var(--safe-y); padding: 28px 44px; background: var(--plate);
          border-radius: var(--radius); box-shadow: var(--shadow); text-align: right; opacity: 0; }
  .num { font-size: var(--size-hero); font-weight: var(--weight-display); color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
  .label { font-family: var(--font-body); font-size: var(--size-body); color: var(--ink); margin-top: 8px; }
</style></head>
<body>
<div id="root" data-composition-id="{{ID}}" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
  <div class="card" data-qc-align="right" data-qc-safe="title">
    <div class="num">{{PREFIX}}<span class="val">0</span>{{SUFFIX}}</div>
    <div class="label">{{LABEL}}</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="../hf-timeline.js"></script>
<script>
  const LAND = {{LAND_AT}};       // seconds into this clip when the number is spoken
  const D = parseFloat(document.getElementById("root").dataset.duration);
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(".card", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0)
    .fromTo(".val", { textContent: 0 }, { textContent: {{VALUE}}, snap: { textContent: 1 }, duration: Math.max(0.3, LAND - 0.1), ease: "expo.out" }, 0.1)
    .fromTo(".num", { scale: 1 }, { scale: 1.08, duration: 0.12, ease: "power2.out" }, LAND)
    .to(".num", { scale: 1, duration: 0.2, ease: "power2.inOut" }, LAND + 0.12)
    .to(".card", { opacity: 0, x: 40, duration: 0.25, ease: "power2.in" }, D - 0.25);
  window.__timelines = window.__timelines || {};
  window.__timelines["{{ID}}"] = tl;
</script>
</body></html>
