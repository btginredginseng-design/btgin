<!doctype html>
<!-- Treatment: section-title (section beat). Small label + rule, top-left. Marks structure, doesn't shout. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { margin: 0; background: transparent; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--font-display); }
  .sec { position: absolute; left: var(--safe-x); top: var(--safe-y); color: var(--ink); text-shadow: var(--shadow); }
  .idx { font-size: 34px; color: var(--accent); font-weight: 700; letter-spacing: 0.12em; opacity: 0; }
  .name { font-size: var(--size-title); font-weight: var(--weight-display); opacity: 0; }
  .rule { height: 6px; width: 0; background: var(--accent); border-radius: 3px; margin-top: 10px; }
</style></head>
<body>
<div id="root" data-composition-id="{{ID}}" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
  <div class="sec" data-qc-align="left" data-qc-safe="title">
    <div class="idx">{{INDEX}}</div><div class="name">{{TITLE}}</div><div class="rule"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="../hf-timeline.js"></script>
<script>
  const D = parseFloat(document.getElementById("root").dataset.duration);
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(".idx", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 0)
    .fromTo(".name", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.08)
    .fromTo(".rule", { width: 0 }, { width: 220, duration: 0.45, ease: "expo.out" }, 0.15)
    .to(".sec", { opacity: 0, duration: 0.25, ease: "power2.in" }, D - 0.25);
  window.__timelines = window.__timelines || {};
  window.__timelines["{{ID}}"] = tl;
</script>
</body></html>
